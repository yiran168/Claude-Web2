<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Web2</title>
    <link rel="icon" href="/static/assets/favicon.ico">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <!-- App Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><span class="logo">Claude</span> Web2</h1>
                <button id="new-chat-btn" class="btn btn-ghost w-full">
                    <span>✕</span>
                    新建对话
                </button>
            </div>
            
            <nav class="conversation-list" id="conversation-list">
                <!-- Dynamic conversation items -->
            </nav>
            
            <div class="sidebar-footer">
                <button id="settings-btn" class="btn btn-ghost w-full">
                    <span>⚙</span>
                    设置
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="chat-header">
                <h2 id="current-model">Claude-3.5-Sonnet</h2>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    在线
                </div>
            </header>

            <div class="messages-container" id="messages-container">
                <div class="welcome-screen">
                    <h3>👋 欢迎使用 Claude Web2</h3>
                    <p>输入消息开始对话吧~</p>
                    <div class="quick-actions">
                        <button class="quick-action" onclick="quickActions.explainCode()">
                            解释代码
                        </button>
                        <button class="quick-action" onclick="quickActions.translate()">
                            翻译为英文
                        </button>
                        <button class="quick-action" onclick="quickActions.debugCode()">
                            调试代码
                        </button>
                    </div>
                </div>
            </div>

            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="message-input" 
                        placeholder="输入消息..." 
                        rows="1"
                        autocomplete="off"
                    ></textarea>
                    <div class="input-actions">
                        <button id="attach-btn" class="btn btn-ghost">
                            📎
                        </button>
                        <button id="send-btn" class="btn btn-primary" disabled>
                            发送
                        </button>
                    </div>
                </div>
                <div class="model-selector-container">
                    <select id="model-select" class="model-select">
                        <option value="claude-sonnet-4-20250514">Claude 4 Sonnet (最新)</option>
                        <option value="claude-opus-4-20250514">Claude 4 Opus (最强)</option>
                        <option value="claude-3-7-sonnet-20250219">Claude 3.7 Sonnet</option>
                        <option value="claude-3-5-sonnet-20241022" selected>Claude 3.5 Sonnet</option>
                        <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku</option>
                        <option value="claude-3-5-sonnet-20240620">Claude 3.5 Sonnet (旧版)</option>
                    </select>
                </div>
            </footer>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>设置</h3>
                <button id="close-settings" class="btn btn-ghost">✕</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>API 密钥</label>
                    <input 
                        type="password" 
                        id="api-key-input" 
                        placeholder="输入 API 密钥"
                        class="input"
                    >
                </div>
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="streaming-toggle" checked>
                        流式输出
                    </label>
                </div>
                <div class="setting-group">
                    <label>响应格式</label>
                    <select id="response-format-select" class="model-select">
                        <option value="openai">OpenAI 格式</option>
                        <option value="claude">Claude 原生格式</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>会话密钥 (Session Keys)</label>
                    <textarea 
                        id="sessions-input" 
                        placeholder='["sk-ant-sid01-xxx", "sk-ant-sid01-yyy"]'
                        class="input" rows="3"
                    ></textarea>
                    <small>Claude.ai 会话密钥列表 (JSON 数组格式)</small>
                </div>
                <div class="setting-group">
                    <label>OAuth Token</label>
                    <textarea 
                        id="oauth-input" 
                        placeholder='[{"access_token":"xxx","refresh_token":"yyy","expires_at":123}]'
                        class="input" rows="3"
                    ></textarea>
                    <small>OAuth 令牌 (JSON 数组)</small>
                </div>
                <div class="setting-group">
                    <label>Cookies</label>
                    <textarea 
                        id="cookies-input" 
                        placeholder='[{"claude.ai": [{"name":"sessionKey","value":"xxx"}]}]'
                        class="input" rows="3"
                    ></textarea>
                    <small>浏览器 Cookie 格式</small>
                </div>
                <div class="setting-group">
                    <label>代理设置</label>
                    <input 
                        type="text" 
                        id="proxy-input" 
                        placeholder="http://user:pass@host:port"
                        class="input"
                    >
                </div>
                <div class="setting-group">
                    <button id="save-account-btn" class="btn btn-outline w-full">
                        保存并激活账户
                    </button>
                </div>
                <div class="setting-group">
                    <button id="fetch-models-btn" class="btn btn-ghost w-full">
                        刷新模型列表
                    </button>
                </div>
                <div class="api-info">
                    <h4>你的 API 密钥</h4>
                    <div class="api-key-display">
                        <code id="generated-api-key">sk-claude-local-xxx</code>
                        <button id="copy-api-key" class="btn btn-ghost">复制</button>
                    </div>
                    <small>使用此密钥调用 API</small>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings" class="btn btn-primary w-full">
                    保存设置
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
