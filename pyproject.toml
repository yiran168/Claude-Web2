[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "claude-web2"
version = "0.1.0"
description = "High-performance Claude.ai web-to-API proxy with OpenAI-compatible interface"
authors = ["OpenHands <openhands@all-hands.dev>"]
readme = "README.md"
license = "MIT"
packages = [{include = "app"}]
keywords = ["claude", "ai", "proxy", "openai", "anthropic", "web2api"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
httpx = "^0.27.0"
curl-cffi = {version = ">=0.6.0", extras = ["http2"]}
pydantic = "^2.7.0"
python-multipart = "^0.0.9"
python-dotenv = "^1.0"
loguru = "^0.7.0"
tenacity = "^8.2.3"
gunicorn = "^21.2.0"
pydantic-settings = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = {extras = ["dev"], version = "^0.27.0"}
black = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "N", "UP", "B", "FA"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
